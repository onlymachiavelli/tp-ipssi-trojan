services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:root@host.docker.internal:5432/ipssi}
      PORT: ${PORT:-8000}
    restart: unless-stopped